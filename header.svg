<svg viewBox="0 0 900 280" width="900" height="280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Jiyad Hussain — AI Engineer building vision, satellite and edge AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#141a2e"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#c8a2ff"/>
      <stop offset="0.55" stop-color="#6b4fd8"/>
      <stop offset="1" stop-color="#1c1640"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd1e3"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddc97" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3ddc97" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3ddc97" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <clipPath id="card"><rect width="900" height="280" rx="18"/></clipPath>
    <style>
      .sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
      .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      .fade{opacity:0;animation:in .7s ease-out forwards}
      @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
      .d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.6s}.d4{animation-delay:.85s}.d5{animation-delay:1.1s}
      .blink{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="280" fill="url(#bg)"/>
    <rect width="900" height="280" fill="url(#dots)"/>

    <!-- stars -->
    <g fill="#ffffff">
      <circle cx="560" cy="40" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="845" cy="230" r="1"><animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="215" r="1.4"><animate attributeName="opacity" values=".3;1;.3" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="870" cy="60" r="1.1"><animate attributeName="opacity" values="1;.3;1" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="660" cy="120" r=".9"><animate attributeName="opacity" values=".2;.9;.2" dur="2.8s" repeatCount="indefinite"/></circle>
    </g>

    <!-- planet + orbit + satellite -->
    <g transform="translate(735 140)">
      <circle r="92" fill="#6b4fd8" opacity="0.10"/>
      <circle r="56" fill="url(#planet)"/>
      <path d="M-50 -10 C -20 -22, 20 4, 52 -6" stroke="#ffffff" stroke-opacity=".18" stroke-width="3" fill="none"/>
      <path d="M-46 16 C -10 6, 22 28, 48 18" stroke="#ffffff" stroke-opacity=".12" stroke-width="3" fill="none"/>
      <!-- plume rising off the surface -->
      <g opacity=".85">
        <circle cx="-18" cy="-44" r="5" fill="#3ddc97" opacity=".55">
          <animate attributeName="cy" values="-44;-70" dur="3s" repeatCount="indefinite"/>
          <animate attributeName="r" values="4;12" dur="3s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".6;0" dur="3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-14" cy="-44" r="5" fill="#3ddc97" opacity=".55">
          <animate attributeName="cy" values="-44;-72" dur="3s" begin="1.5s" repeatCount="indefinite"/>
          <animate attributeName="r" values="4;13" dur="3s" begin="1.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".6;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
        </circle>
      </g>
      <ellipse rx="112" ry="34" fill="none" stroke="#c8a2ff" stroke-opacity=".35" stroke-dasharray="3 6" transform="rotate(-18)"/>
      <g transform="rotate(-18)">
        <g>
          <animateMotion dur="7s" repeatCount="indefinite" rotate="auto" path="M112 0 A112 34 0 1 1 -112 0 A112 34 0 1 1 112 0"/>
          <rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="#ff3d81"/>
          <rect x="-15" y="-2" width="9" height="4" fill="#ffd1e3"/>
          <rect x="6" y="-2" width="9" height="4" fill="#ffd1e3"/>
        </g>
      </g>
    </g>

    <!-- text block -->
    <text x="48" y="62" class="mono fade d1" font-size="14" fill="#3ddc97">~/jiyad-hussain  ·  new delhi, IN  ·  open to remote</text>
    <text x="46" y="122" class="sans fade d2" font-size="54" font-weight="800" letter-spacing="-1" fill="url(#name)">Jiyad Hussain</text>
    <text x="48" y="160" class="sans fade d3" font-size="20" font-weight="600" fill="#c8a2ff">AI Engineer · Vision, Satellite &amp; Edge AI</text>
    <text x="48" y="190" class="sans fade d4" font-size="15" fill="#9aa4bf">Turning raw pixels, spectra and audio into models that ship.</text>

    <!-- chips -->
    <g class="fade d5" font-size="12.5" font-weight="700">
      <rect x="48"  y="214" width="104" height="28" rx="14" fill="#3ddc97" fill-opacity=".14" stroke="#3ddc97" stroke-opacity=".6"/>
      <text x="100" y="233" text-anchor="middle" class="mono" fill="#3ddc97">VayuNetra</text>
      <rect x="162" y="214" width="100" height="28" rx="14" fill="#c8a2ff" fill-opacity=".14" stroke="#c8a2ff" stroke-opacity=".6"/>
      <text x="212" y="233" text-anchor="middle" class="mono" fill="#c8a2ff">ArcVisual</text>
      <rect x="272" y="214" width="86" height="28" rx="14" fill="#ff3d81" fill-opacity=".14" stroke="#ff3d81" stroke-opacity=".6"/>
      <text x="315" y="233" text-anchor="middle" class="mono" fill="#ff8fb6">Panjika</text>
      <rect x="368" y="214" width="110" height="28" rx="14" fill="#ffc857" fill-opacity=".12" stroke="#ffc857" stroke-opacity=".6"/>
      <text x="423" y="233" text-anchor="middle" class="mono" fill="#ffc857">ChotiVaani</text>
      <text x="492" y="233" class="mono blink" fill="#9aa4bf">_</text>
    </g>

    <!-- scan line -->
    <rect x="-300" y="276" width="300" height="2" fill="url(#scan)">
      <animate attributeName="x" values="-300;900" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
